    html, body {

    nav ul li a {

    }
    button {
      padding: 10px 20px;

      margin-top: 50px;
    }
  </style>
</head>
<body>
  
   <a href="index.html">
    <div style="
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 80px;
      z-index: 10;
    ">
    </div>
  </a>
  <a>
    <button class="bouton-positionne" onclick="window.location.href='index.html';">Accueil</button>
    <button onclick="window.location.href='LoginRegister.html'" style="margin-left: 1000px;"   class="bouton-positionne">Déconnexion</button>
  </a>

  <div class="container" style="margin-top: 300px;">
    <div class="card-panel">
      <h5>Mon Profil Entreprise</h5>
      <p><strong>Nom :</strong> <span id="nom"></span></p>
      <p><strong>Email :</strong> <span id="email"></span></p>
      <p><strong>Departement :</strong> <span id="departement"></span></p>
      <p><strong>Créé le :</strong> <span id="created"></span></p>
      <p><strong>Mis à jour le :</strong> <span id="update"></span></p>
    </div>
  </div>
  <div style="text-align:right; max-width:800px; margin:20px auto;">
    <button id="btn-creer-annonce" class="bouton-bas" >Créer une annonce</button>
  </div>

  <script>
  // Récupère le paramètre "id" dans l'URL (ex: compte.html?id=3)
  const params = new URLSearchParams(window.location.search);
  const compteId = params.get('id');
  const btnCreerAnnonce = document.getElementById('btn-creer-annonce');
  if (compteId) {
    // Si une entreprise est connectée → activer le bouton
    btnCreerAnnonce.addEventListener('click', () => {
      window.location.href = `annonces.html?entrepriseId=${entrepriseId}`;
    });
  } else {
    // Sinon, désactiver ou masquer le bouton
    btnCreerAnnonce.style.display = 'none';}


  if (compteId) {
    fetch(`http://localhost:8000/api/entreprises/${compteId}/`)
      .then(response => response.json())
      .then(entreprise => {
        document.getElementById('nom').innerHTML = entreprise.nom;
        document.getElementById('email').innerHTML = entreprise.email;
        document.getElementById('departement').innerHTML = entreprise.departement;
        document.getElementById('created').innerHTML = entreprise.created_at;
        document.getElementById('update').innerHTML = entreprise.updated_at;
      })
      .catch(error => console.error('Erreur chargement entreprise:', error));
  } else {
    console.error('Aucun ID d’entreprise trouvé dans l’URL');
  }

    const params2 = new URLSearchParams(window.location.search);
    const entrepriseId = params2.get('id');

     

  </script>

</body>
