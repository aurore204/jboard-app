<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Candidats</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, #ece9e6, #ffffff);
            font-family: 'Roboto', sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        table {
            width: 100%;
        }
        th, td {
            padding: 15px;
            text-align: left;
        }
        th {
            background-color: #1976d2;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="center-align">Liste des Candidats pour l'Annonce</h3>
        <table class="striped">
            <thead>
                <tr>
                    <th>prenom</th>
                    <th>nom</th>
                    <th>intitule_emploi</th>
                    <th>Date de Candidature</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>
            </thead>
            <tbody id="candidatsTableBody">
                <!-- Les lignes des candidats seront insérées ici par JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {// Attendre que le DOM soit chargé, le dom est la structure HTML de la page elle sert a afficher les éléments 
            const urlParams = new URLSearchParams(window.location.search);// on récupère les paramètres de l'URL
            const annonceId = urlParams.get('annonce_id');

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/candidatures/${annonceId}/personne/`);// on fait une requête fetch pour récupérer les candidatures associées à l'annonce
                const candidatures = await response.json();

                // Insérer les candidatures dans le tableau
                const tableBody = document.getElementById('candidatsTableBody');
                candidatures.forEach(candidature => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${candidature.personne.prenom}</td>
                        <td>${candidature.personne.nom}</td>
                        <td>${candidature.annonce.intitule_emploi}</td>
                        <td>${candidature.date_candidature}</td>
                        <td>${candidature.status}</td>
                        <td>
                            <button class="btn red" onclick="deleteCandidature(${candidature.id})">Supprimer</button>
                            <button class="btn green" onclick="voirCandidature(${candidature.id})">Voir</button>

                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Erreur lors de la récupération des candidatures:', error);
            }
        });

        async function deleteCandidature(candidatureId) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette candidature ?')) {
                try {
                    const response = await fetch(`http://127.0.0.1:8000/api/Candidature/${candidatureId}/`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        document.getElementById('candidatsTableBody').innerHTML = '';
                        // Recharger la liste des candidatures
                        location.reload();
                    } else {
                        console.error('Erreur lors de la suppression de la candidature:', response.statusText);
                    }
                } catch (error) {
                    console.error('Erreur lors de la suppression de la candidature:', error);
                }
            }
        }
    </script>
</body>
</html>
