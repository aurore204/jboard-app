<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compte Standard - FlashJob</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <style>
    body {
      background-image: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), url('background.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    .bouton-positionne {
      position: absolute;
      top: 100px;
      left: 200px;
    }
    button {
      padding: 10px 20px;
      background-color: rgb(0, 162, 255);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <a>
    <button class="bouton-positionne" onclick="window.location.href='Historique.html';">Historique</button>
    <button style="margin-left: 1000px;" class="bouton-positionne" onclick="window.location.href='LoginRegister.html';">Déconnexion</button>
  </a>

  <div class="container" style="margin-top: 200px;">
    <div class="card-panel">
      <h5>Mon Profil Standard</h5>
      <p><strong>Nom :</strong> <span id="nom"></span></p>
      <p><strong>Prénom :</strong> <span id="prenom"></span></p>
      <p><strong>Email :</strong> <span id="email"></span></p>
      <p><strong>CV :</strong> <span id="cv"></span></p>
      <p><strong>Créé le :</strong> <span id="created"></span></p>
      <p><strong>Mis à jour le :</strong> <span id="update"></span></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const compteId = params.get('id');

    if (compteId) {
      fetch(`http://localhost:8000/myflashjob/api/personnes/${compteId}`)
        .then(response => response.json())
        .then(personne => {
          document.getElementById('nom').innerHTML = personne.intitule_emploi;
          document.getElementById('prenom').innerHTML = personne.description;
          document.getElementById('email').innerHTML = personne.salaire;
          document.getElementById('cv').innerHTML = personne.type_contrat;
          document.getElementById('created').innerHTML = personne.horaires;
          document.getElementById('update').innerHTML = personne.date_publication;
        })
        .catch(error => console.error('Erreur chargement personne:', error));
    } else {
      console.error("Aucun ID d'utilisateur trouvé dans l'URL");
    }
  </script>

</body>
</html>
