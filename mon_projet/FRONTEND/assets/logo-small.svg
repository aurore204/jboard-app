<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#00A2FF" opacity="0.1"/>
  
  <!-- Main icon: Lightning bolt with briefcase -->
  <g transform="translate(20, 20)">
    <!-- Lightning bolt -->
    <path d="M-6,-8 L3,-8 L-1,1 L5,1 L-2,8 L-8,0 Z" 
          fill="#00A2FF" 
          stroke="#0073e6" 
          stroke-width="0.8"/>
    
    <!-- Briefcase icon -->
    <g transform="translate(8, -5)">
      <rect x="-4" y="-3" width="8" height="6" 
            fill="none" 
            stroke="#00A2FF" 
            stroke-width="1.5" 
            rx="0.8"/>
      <rect x="-5" y="-1" width="10" height="1.5" 
            fill="#00A2FF"/>
      <line x1="-2" y1="-3" x2="-2" y2="3" 
            stroke="#00A2FF" 
            stroke-width="0.8"/>
      <line x1="2" y1="-3" x2="2" y2="3" 
            stroke="#00A2FF" 
            stroke-width="0.8"/>
    </g>
  </g>
</svg>



