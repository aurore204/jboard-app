  .search-bar {
    margin-top: 300px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
    padding: 20px;
    background-color: #f5f5f5;
    border-radius: 8px;
  }

  .search-group {
    flex: 1 1 200px;
    display: flex;
    flex-direction: column;
  }

  .search-group label {
    font-weight: bold;
    margin-bottom: 5px;
  }

  .search-group select,
  .search-group input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .search-button {
    flex: 1 1 100%;
    text-align: center;
    margin-top: 10px;
  }

  .search-button button {
    padding: 10px 20px;
    background-color: #0073e6;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
  }
  select {
    display: block;
    width: 100%;
    padding: 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: white;
    appearance: auto;
}

<script>
const params1 = new URLSearchParams(window.location.search);
const personneId = params1.get('personneId');
const params2 = new URLSearchParams(window.location.search);
const entrepriseId = params2.get('entrepriseId');



document.getElementById('log').addEventListener('click', () => {
    console.log("Bien détecté!");
    if(personneId){
        window.location.href = `compte_utilisateur.html?personneId=${personneId}`;
    }
    else if(entrepriseId){
        window.location.href = `compte_entreprise.html?entrepriseId=${entrepriseId}`;
    }
    else {
        window.location.href='LoginRegister.html';
    }
});

// ---------- Annonces ----------


if (personneId){
   document.getElementById('loadAnnoncesBtn').addEventListener('click', () => {
    fetch('http://localhost:8000/myflashjob/api/annonces/')
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('AnnoncesContainer');
        container.innerHTML = '';
        data.forEach(annonce => {
            const div = document.createElement('div');
            div.innerHTML = `<h3>${annonce.intitule_emploi} chez ${annonce.entreprise__nom}</h3>
                             <p><i>${annonce.departement}</i></p>
                             <p>Type de contrat : ${annonce.type_contrat}</p>
                             <button onclick="window.location.href='details.html?personneId=${personneId}&id=${annonce.id}';" type="button">Voir plus</button>`;
            container.appendChild(div);
        });
    })
    .catch(error => console.error('Erreur Annonces:', error));
});

} else if(entrepriseId){
    document.getElementById('loadAnnoncesBtn').addEventListener('click', () => {
    fetch('http://localhost:8000/myflashjob/api/annonces/')
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('AnnoncesContainer');
        container.innerHTML = '';
        data.forEach(annonce => {
            const div = document.createElement('div');
            div.innerHTML = `<h3>${annonce.intitule_emploi} chez ${annonce.entreprise__nom}</h3>
                             <p><i>${annonce.departement}</i></p>
                             <p>Type de contrat : ${annonce.type_contrat}</p>
                             <button onclick="window.location.href='details.html?entrepriseId=${entrepriseId}&id=${annonce.id}';" type="button">Voir plus</button>`;
            container.appendChild(div);
        });
    })
    .catch(error => console.error('Erreur Annonces:', error));
});

}else{
document.getElementById('loadAnnoncesBtn').addEventListener('click', () => {
    fetch('http://localhost:8000/myflashjob/api/annonces/')
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('AnnoncesContainer');
        container.innerHTML = '';
        data.forEach(annonce => {
            const div = document.createElement('div');
            div.innerHTML = `<h3>${annonce.intitule_emploi} chez ${annonce.entreprise__nom}</h3>
                             <p><i>${annonce.departement}</i></p>
                             <p>Type de contrat : ${annonce.type_contrat}</p>
                             <button onclick="window.location.href='details.html?id=${annonce.id}';" type="button">Voir plus</button>`;
            container.appendChild(div);
        });
    })
    .catch(error => console.error('Erreur Annonces:', error));
});
}

</script>
