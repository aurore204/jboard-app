<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlashJob</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0)), url('background2.jpg');
      background-repeat: no-repeat;
      background-size: cover;
    }

    .top-buttons {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    .top-buttons button {
      margin-right: 20px;
    }

    .header {
      text-align: center;
      margin-top: 100px;
      font-size: 2.5rem;
      font-weight: bold;
      color: red;
    }

    .header i {
      color: gold;
      margin: 0 10px;
    }
    button {
      padding: 10px 20px;
      background-color: rgb(0, 162, 255);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .bouton-positionne {
      position: absolute;
      top: 100px;
      left: 200px;
    }

    .form-section {
      margin-top: 50px;
    }

    .card-panel h5 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <a>
    <button class="bouton-positionne" onclick="window.location.href='Candidatures.html';">Candidatures</button>
    <button style="margin-left: 1000px;" class="bouton-positionne" onclick="window.location.href='LoginRegister.html';">Login/Inscription</button>
  </a>

  <div class="container" style="margin-top: 200px;">
    <div class="card-panel">
      <h5>Connexion</h5>
      <form action="/login" method="POST">
        <div class="input-field">
          <input type="email" id="login-email" name="email" required>
          <label for="login-email">Email</label>
        </div>
        <div class="input-field">
          <input type="password" id="login-password" name="password" required>
          <label for="login-password">Mot de passe</label>
        </div>
        <button type="submit" class="btn blue">Se connecter</button>
      </form>
    </div>
  </div>

 <div class="container form-section">
    <div class="row">
      <div class="col s12 m6">
        <div class="card-panel">
          <h5>Inscription Standard</h5>
          <form action="/register-standard" method="POST">
            <div class="input-field">
              <input type="text" id="nom-prenom" name="nom_prenom" required>
              <label for="nom-prenom">Nom Prénom</label>
            </div>
            <div class="input-field">
              <input type="email" id="email-standard" name="email" required>
              <label for="email-standard">Mail</label>
            </div>
            <div class="input-field">
              <input type="password" id="password-standard" name="password" required>
              <label for="password-standard">Mot de passe</label>
            </div>
            <button type="submit" class="btn green">S'inscrire</button>
          </form>
        </div>
      </div>

      <div class="col s12 m6">
        <div class="card-panel">
          <h5>Inscription Entreprise</h5>
          <form action="/register-entreprise" method="POST">
            <div class="input-field">
              <input type="text" id="nom-entreprise" name="nom_entreprise" required>
              <label for="nom-entreprise">Nom entreprise</label>
            </div>
            <div class="input-field">
              <input type="email" id="email-contact" name="email_contact" required>
              <label for="email-contact">Mail contact</label>
            </div>
            <div class="input-field">
              <input type="text" id="domaine" name="domaine" required>
              <label for="domaine">Domaine d'activité</label>
            </div>
            <div class="input-field">
              <input type="password" id="password-entreprise" name="password" required>
              <label for="password-entreprise">Mot de passe</label>
            </div>
            <button type="submit" class="btn orange">S'inscrire</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
