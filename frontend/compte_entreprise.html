<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Compte Entreprise - FlashJob</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background-image: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0)), url('background.jpg');
      background-repeat: no-repeat;
      background-size: cover;
    }
    .bouton-positionne {
      position: absolute;
      top: 100px;
      left: 200px;
    }
    button {
      padding: 10px 20px;
      background-color: rgb(0, 162, 255);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .form-section {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <a>
    <button class="bouton-positionne" onclick="window.location.href='Historique.html';">Historique</button>
    <button onclick="window.location.href='index.html'" style="margin-left: 1000px;"   class="bouton-positionne">Déconnexion</button>
  </a>

  <div class="container" style="margin-top: 300px;">
    <div class="card-panel">
      <h5>Mon Profil Entreprise</h5>
      <p><strong>Nom :</strong> <span id="nom"></span></p>
      <p><strong>Email :</strong> <span id="email"></span></p>
      <p><strong>Departement :</strong> <span id="departement"></span></p>
      <p><strong>Créé le :</strong> <span id="created"></span></p>
      <p><strong>Mis à jour le :</strong> <span id="update"></span></p>
    </div>
  </div>
  <div style="text-align:right; max-width:800px; margin:20px auto;">
    <button id="postuler" class="bouton-bas" >Créée une annonce</button>
  </div>

  <script>
  // Récupère le paramètre "id" dans l'URL (ex: compte.html?id=3)
  const params = new URLSearchParams(window.location.search);
  const compteId = params.get('entrepriseId');

  if (compteId) {
    fetch(`http://localhost:8000/myflashjob/api/entreprises/${compteId}/`)
      .then(response => response.json())
      .then(entreprise => {
        document.getElementById('nom').innerHTML = entreprise.nom;
        document.getElementById('email').innerHTML = entreprise.email;
        document.getElementById('departement').innerHTML = entreprise.departement;
        document.getElementById('created').innerHTML = entreprise.created_at;
        document.getElementById('update').innerHTML = entreprise.updated_at;
      })
      .catch(error => console.error('Erreur chargement entreprise:', error));
  } else {
    console.error('Aucun ID d’entreprise trouvé dans l’URL');
  }

    const params2 = new URLSearchParams(window.location.search);
    const entrepriseId = params2.get('entrepriseId');

    document.getElementById('postuler').addEventListener('click', () => {
    console.log("Bien détecté!");
       window.location.href = `index.html?entrepriseId=${entrepriseId}`; 
    });

  </script>

</body>
</html>

</html>
