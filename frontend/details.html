<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FlashJob - Détails de l'annonce</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="index.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background-image: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0)), url('background2.jpg');
      background-repeat: no-repeat;
      background-size: cover;
    }
    .top-buttons { position: absolute; top: 20px; left: 20px; z-index: 10; }
    .top-buttons button { margin-right: 20px; }
    .header { text-align: center; margin-top: 200px; font-size: 2rem; font-weight: bold; color: gold; }
    .header i { color: gold; margin: 10px; }
    button {
      padding: 10px 20px;
      background-color: rgb(0, 162, 255);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .bouton-positionne { position: absolute; top: 100px; left: 200px; }
    .bouton-bas{ padding: 10px 20px; background-color: rgb(0, 162, 255); color: white; border: none; border-radius: 5px; cursor: pointer; }
    .content {
      max-width: 800px;
      margin: 15px auto;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .content strong { color: #000; }
  </style>
</head>
<body>

  <div class="top-buttons">
    <button onclick="window.location.href='Candidatures.html';">Candidatures</button>
    <button onclick="window.location.href='LoginRegister.html';">Login/Inscription</button>
  </div>

  <div class="header">
    DÉTAILS DE L'OFFRE
  </div>

  <div class="content">
    <p><strong>Titre :</strong> <span id="titre"></span></p>
    <p><strong>Description :</strong> <span id="description"></span></p>
    <p><strong>Salaire :</strong> <span id="salaire"></span> €</p>
    <p><strong>Type de contrat :</strong> <span id="type_contrat"></span></p>
    <p><strong>Horaires :</strong> <span id="horaires"></span></p>
    <p><strong>Publié le :</strong> <span id="date_publication"></span></p>
    <p><strong>Entreprise :</strong> <span id="entreprise"></span></p>
  </div>

  <div style="text-align:right; max-width:800px; margin:20px auto;">
    <button class="bouton-bas" onclick="postuler()">Postuler</button>
  </div>

  

</body>
</html>
